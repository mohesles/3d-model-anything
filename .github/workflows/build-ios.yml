name: Build iOS app (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (prefer 27 if the runner has it)
        run: |
          XC=$(ls -d /Applications/Xcode_27* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          ls -d /Applications/Xcode* || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: |
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 27 ]; then
            sed -i '' 's/xcodeVersion: "27.0"/xcodeVersion: "26.0"/' project.yml
          fi
          xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: apps/house-capture
        run: |
          xcodebuild \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: apps/house-capture
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Found app: $APP"
          rm -rf Payload HouseCapture.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HouseCapture.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa
          path: apps/house-capture/HouseCapture.ipa
          retention-days: 14
